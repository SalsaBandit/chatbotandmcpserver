spring.application.name=mcp-client

# Runtime MCP connections are created after a user adds a server in the UI.
# DynamicMcpService makes synchronous calls because each chat request waits for model tool results.
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
server.port=8040
server.servlet.session.cookie.name=MCP_CLIENT_SESSION

spring.ai.ollama.chat.model=gemma4
